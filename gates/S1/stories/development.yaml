  - the register office closes early on the last Friday of each month
  - the register switched to a new search page in the spring
  - the register prints its letters to nurses on pale blue paper
  - the register's help desk answers phone calls on weekday mornings
  shared:
  - The Brookvale Clinic needs a certified nurse for its weekend shifts.
  - Mira Tolsen is one of three nurses who might cover those shifts.
