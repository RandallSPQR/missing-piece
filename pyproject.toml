[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-piece"
version = "0.0.1"
description = "Missing Piece (revision 2): does support for a false report depend on whether its advocate knows it is false, and on whether a receiver holds contradicting evidence?"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0", "numpy", "scipy", "pandas", "statsmodels", "jsonschema", "jinja2",
  # the shared pipeline, pinned by COMMIT (pins.yaml)
  "sae-ethos-pipeline @ git+https://github.com/RandallSPQR/SAE-Ethos-Calibration@5ca15f56a71f35d5818d0392f7f3b4acb2d85d1b",
]

[tool.setuptools]
packages = ["mp"]
